<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slideshow Film Filter - The Station</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: sans-serif; background:#2a0f14; color:#f8efd8; max-width:560px; margin:60px auto; padding:0 20px; }
h1 { font-size:1.4rem; color:#d4a523; }
p.help { color:#e6d9b7; font-size:0.9rem; }
label.item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #3a131a; font-size:1rem; }
label.item input[type=checkbox] { width:20px; height:20px; flex-shrink:0; }
label.item span.title { flex:1; }
label.item select.category { background:#3a131a; color:#f8efd8; border:1px solid #55202a; border-radius:6px; padding:8px 10px; font-size:0.9rem; }
input#passcode { width:100%; padding:10px; margin-top:6px; border-radius:6px; border:none; font-size:1rem; box-sizing:border-box; text-align:center; }
button { margin-top:24px; width:100%; padding:14px; background:#d4a523; color:#2a0f14; font-weight:700; border:none; border-radius:6px; font-size:1rem; cursor:pointer; }
button:disabled { opacity:0.5; cursor:not-allowed; }
#status { margin-top:16px; font-size:0.95rem; }
#gate { text-align:center; }
</style>
</head>
<body>
<div id="gate">
<h1>Slideshow Film Filter</h1>
<label>Enter passcode</label>
<input type="password" id="passcode" autocomplete="off">
<button id="unlockBtn">Unlock</button>
</div>

<div id="app" style="display:none">
<h1>Choose which films appear</h1>
<p class="help">Untick a film to hide it from the slideshow's poster carousel. Use the dropdown to override the badge shown on its slide - leave it on "Auto" to let the system decide (New This Week / Coming Soon based on release date).</p>
<div id="list">Loading films...</div>
<button id="saveBtn">Save</button>
<div id="status"></div>
</div>

<script src="slideshow-config.js"></script>
<script>
// Category dropdown options: value -> badge text shown on the slide.
// Empty value ("") means "Auto" - slideshow.js falls back to its own
// New This Week / Coming Soon logic based on TMDb release date.
var CATEGORY_OPTIONS = [
  { value: "", label: "Auto" },
  { value: "new_this_week", label: "New This Week" },
  { value: "now_showing", label: "Now Showing" },
  { value: "coming_soon", label: "Coming Soon" },
  { value: "on_sale_now", label: "On Sale Now" }
];

document.getElementById("unlockBtn").addEventListener("click", async function () {
  var entered = document.getElementById("passcode").value;
  if (entered !== window.UPLOAD_PASSCODE) {
    alert("Wrong passcode.");
    return;
  }
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  await loadFilms();
});

function getSb() {
  return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
}

async function fetchJson(path, fallback) {
  try {
    var sb = getSb();
    var { data: pub } = sb.storage.from(window.SUPABASE_BUCKET).getPublicUrl(path);
    var res = await fetch(pub.publicUrl + "?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return fallback;
    return await res.json();
  } catch (e) {
    return fallback;
  }
}

async function loadFilms() {
  var listEl = document.getElementById("list");
  var res = await fetch("new_this_week.json?_=" + Date.now()).catch(function () { return null; });
  var data = res && res.ok ? await res.json().catch(function () { return null; }) : null;
  var films = (data && data.films) || [];

  var config = await fetchJson("config/excluded_films.json", { excluded: [], categories: {} });
  var excluded = (config && config.excluded) || [];
  var categories = (config && config.categories) || {};
  var excludedLower = excluded.map(function (t) { return t.toLowerCase(); });

  if (!films.length) {
    listEl.textContent = "No films currently listed.";
    return;
  }

  listEl.innerHTML = "";
  films.forEach(function (title) {
    var wrap = document.createElement("label");
    wrap.className = "item";

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = title;
    cb.checked = excludedLower.indexOf(title.toLowerCase()) === -1;
    wrap.appendChild(cb);

    var span = document.createElement("span");
    span.className = "title";
    span.textContent = title;
    wrap.appendChild(span);

    var select = document.createElement("select");
    select.className = "category";
    select.setAttribute("data-title", title);
    CATEGORY_OPTIONS.forEach(function (opt) {
      var o = document.createElement("option");
      o.value = opt.value;
      o.textContent = opt.label;
      select.appendChild(o);
    });
    select.value = categories[title] || "";
    wrap.appendChild(select);

    listEl.appendChild(wrap);
  });
}

document.getElementById("saveBtn").addEventListener("click", async function () {
  var status = document.getElementById("status");
  var btn = document.getElementById("saveBtn");

  var checkboxes = document.querySelectorAll("#list input[type=checkbox]");
  var excluded = [];
  checkboxes.forEach(function (cb) {
    if (!cb.checked) excluded.push(cb.value);
  });

  var selects = document.querySelectorAll("#list select.category");
  var categories = {};
  selects.forEach(function (sel) {
    if (sel.value) categories[sel.getAttribute("data-title")] = sel.value;
  });

  btn.disabled = true;
  status.textContent = "Saving...";

  var sb = getSb();
  var payload = JSON.stringify({ excluded: excluded, categories: categories, updated: new Date().toISOString() });
  var blob = new Blob([payload], { type: "application/json" });

  var result = await sb.storage.from(window.SUPABASE_BUCKET).upload(
    "config/excluded_films.json", blob, { upsert: true, contentType: "application/json" }
  );

  btn.disabled = false;
  if (result.error) {
    status.textContent = "Save failed: " + result.error.message;
  } else {
    status.textContent = "Saved! The display will pick this up within 15 minutes, or refresh it now.";
  }
});
</script>
</body>
</html>
